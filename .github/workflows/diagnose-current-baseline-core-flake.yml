name: Diagnose current baseline CoreVerticalSlice flake

on:
  push:
    branches:
      - agent/verify-current-baseline-core

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current integration baseline
        uses: actions/checkout@v4
        with:
          ref: agent/verify-current-baseline-core
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Repeat CoreVerticalSlice three times
        working-directory: frontend
        shell: bash
        run: |
          set +e
          codes=()
          for i in 1 2 3; do
            echo "===== CORE RUN $i ====="
            npm test -- CoreVerticalSlice.test.tsx
            codes+=("$?")
          done
          set -e
          echo "CORE_EXIT_CODES=${codes[*]}"
      - name: Repeat full frontend suite twice
        working-directory: frontend
        shell: bash
        run: |
          set +e
          codes=()
          for i in 1 2; do
            echo "===== FULL RUN $i ====="
            npm test
            codes+=("$?")
          done
          set -e
          echo "FULL_EXIT_CODES=${codes[*]}"
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
