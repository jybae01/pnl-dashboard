name: Verify post-merge bidirectional integration

on:
  push:
    branches:
      - agent/verify-postmerge-bidirectional-408148

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact integration commit
        uses: actions/checkout@v4
        with:
          ref: 4081487a7a19917de19265b830aee27f5156312a
          fetch-depth: 0
      - name: Verify exact source identity and feature scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "4081487a7a19917de19265b830aee27f5156312a"
          test "$(git rev-parse HEAD^{tree})" = "6e455bd5384e33aa7101743369f17592c1bb7cd6"
          actual="$(git diff --name-only 8bd98a02255e6da7c3c6d3a5ba6a04eed9fe76dd..HEAD | sort)"
          expected="$(printf '%s\n' \
            'frontend/src/integration/ForecastVerticalSlice.test.tsx' \
            'frontend/src/views/ForecastGenerationView.tsx' | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse 8bd98a02255e6da7c3c6d3a5ba6a04eed9fe76dd:frontend/src/integration/CoreVerticalSlice.test.tsx)" = "$(git rev-parse HEAD:frontend/src/integration/CoreVerticalSlice.test.tsx)"
          echo "SOURCE_IDENTITY=PASS"
          echo "FEATURE_SCOPE=PASS_TWO_FILES"
          echo "CORE_TEST_SOURCE_UNCHANGED=PASS"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Repeat Forecast vertical-slice twice
        working-directory: frontend
        shell: bash
        run: |
          npm test -- ForecastVerticalSlice.test.tsx
          npm test -- ForecastVerticalSlice.test.tsx
          echo "FORECAST_REPEAT=PASS_X2"
      - name: Verify PNL template integration
        working-directory: frontend
        shell: bash
        run: |
          npm test -- PnlReportingTemplateIntegration.test.tsx
          echo "PNL_TEMPLATE=PASS"
      - name: Probe unchanged Core viewer timing test three times
        working-directory: frontend
        shell: bash
        run: |
          set +e
          codes=""
          for i in 1 2 3; do
            npm test -- CoreVerticalSlice.test.tsx -t "clears cached Viewer result after the backend later denies availability" >"/tmp/core-viewer-$i.log" 2>&1
            code=$?
            codes="$codes $code"
          done
          set -e
          echo "CORE_VIEWER_PROBE_EXIT_CODES=${codes# }"
          echo "CORE_VIEWER_PROBE=DIAGNOSTIC_ONLY"
      - name: Run full suite twice with unchanged-Core differential gate
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/full1.log
          code1=${PIPESTATUS[0]}
          npm test 2>&1 | tee /tmp/full2.log
          code2=${PIPESTATUS[0]}
          set -e
          CODE1="$code1" CODE2="$code2" python - <<'PY'
          import os, re
          from pathlib import Path

          allowed = (
              'src/integration/CoreVerticalSlice.test.tsx > React core vertical slice > preserves overlapping monthly FX values and sends exact YYYY-MM maps',
              'src/integration/CoreVerticalSlice.test.tsx > React core vertical slice > clears cached Viewer result after the backend later denies availability',
          )
          codes = [int(os.environ['CODE1']), int(os.environ['CODE2'])]
          logs = [Path('/tmp/full1.log'), Path('/tmp/full2.log')]
          clean_runs = 0
          allowed_flake_runs = 0
          for i, (code, path) in enumerate(zip(codes, logs), 1):
              text = re.sub(r'\x1b\[[0-9;]*m', '', path.read_text(encoding='utf-8', errors='replace'))
              failures = [line.strip() for line in text.splitlines() if line.strip().startswith('FAIL ')]
              if code == 0:
                  clean_runs += 1
                  if failures:
                      raise SystemExit(f'full run {i}: zero exit with parsed failures: {failures}')
                  continue
              if not failures:
                  raise SystemExit(f'full run {i}: nonzero exit without identifiable test failure')
              unexpected = [line for line in failures if not any(item in line for item in allowed)]
              if unexpected:
                  raise SystemExit(f'full run {i}: unexpected failure(s): {unexpected}')
              if any('ForecastVerticalSlice.test.tsx' in line for line in failures):
                  raise SystemExit(f'full run {i}: Forecast regression detected')
              allowed_flake_runs += 1
          print(f'FULL_SUITE_EXIT_CODES={codes[0]} {codes[1]}')
          print(f'CLEAN_FULL_SUITE_RUNS={clean_runs}')
          print(f'ALLOWED_UNCHANGED_CORE_FLAKE_RUNS={allowed_flake_runs}')
          print('UNCHANGED_CORE_DIFFERENTIAL_GATE=PASS')
          PY
      - name: Lint
        working-directory: frontend
        shell: bash
        run: |
          npm run lint
          echo "LINT=PASS"
      - name: Build
        working-directory: frontend
        shell: bash
        run: |
          npm run build
          echo "BUILD=PASS"
      - name: Final verification classification
        run: |
          echo "FEATURE_DIFFERENTIAL_REGRESSION=PASS"
          echo "INTEGRATION_VERIFICATION=PASS"
          echo "PRODUCTION_CHANGED=NO"
