name: Verify post-merge bidirectional integration

on:
  push:
    branches:
      - agent/verify-postmerge-bidirectional-408148

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact integration commit
        uses: actions/checkout@v4
        with:
          ref: 4081487a7a19917de19265b830aee27f5156312a
          fetch-depth: 0

      - name: Verify exact source identity and feature scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "4081487a7a19917de19265b830aee27f5156312a"
          test "$(git rev-parse HEAD^{tree})" = "6e455bd5384e33aa7101743369f17592c1bb7cd6"
          actual="$(git diff --name-only 8bd98a02255e6da7c3c6d3a5ba6a04eed9fe76dd..HEAD | sort)"
          expected="$(printf '%s\n' \
            'frontend/src/integration/ForecastVerticalSlice.test.tsx' \
            'frontend/src/views/ForecastGenerationView.tsx' | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse 8bd98a02255e6da7c3c6d3a5ba6a04eed9fe76dd:frontend/src/integration/CoreVerticalSlice.test.tsx)" = "$(git rev-parse HEAD:frontend/src/integration/CoreVerticalSlice.test.tsx)"
          test "$(git rev-parse 8bd98a02255e6da7c3c6d3a5ba6a04eed9fe76dd:frontend/src/integration/AnalysisPresentationVerticalSlice.test.tsx)" = "$(git rev-parse HEAD:frontend/src/integration/AnalysisPresentationVerticalSlice.test.tsx)"
          echo "SOURCE_IDENTITY=PASS"
          echo "FEATURE_SCOPE=PASS_TWO_FILES"
          echo "CORE_TEST_SOURCE_UNCHANGED=PASS"
          echo "ANALYSIS_PRESENTATION_TEST_SOURCE_UNCHANGED=PASS"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Repeat Forecast vertical-slice twice
        working-directory: frontend
        shell: bash
        run: |
          npm test -- ForecastVerticalSlice.test.tsx
          npm test -- ForecastVerticalSlice.test.tsx
          echo "FORECAST_REPEAT=PASS_X2"

      - name: Verify PNL template integration
        working-directory: frontend
        shell: bash
        run: |
          npm test -- PnlReportingTemplateIntegration.test.tsx
          echo "PNL_TEMPLATE=PASS"

      - name: Stress exact Analysis presentation case ten times
        working-directory: frontend
        shell: bash
        run: |
          codes=()
          for i in $(seq 1 10); do
            echo "===== CURRENT ANALYSIS EXACT RUN $i ====="
            npm test -- AnalysisPresentationVerticalSlice.test.tsx -t "clears READY presentation and Evidence together when Viewer availability changes"
            codes+=("$?")
          done
          echo "CURRENT_ANALYSIS_EXACT_EXIT_CODES=${codes[*]}"
          echo "CURRENT_ANALYSIS_EXACT_STRESS=PASS_X10"

      - name: Lint
        working-directory: frontend
        shell: bash
        run: |
          npm run lint
          echo "LINT=PASS"

      - name: Build
        working-directory: frontend
        shell: bash
        run: |
          npm run build
          echo "BUILD=PASS"

      - name: Repeat exact current full suite four times
        working-directory: frontend
        shell: bash
        run: |
          codes=()
          for i in 1 2 3 4; do
            echo "===== CURRENT FULL RUN $i ====="
            npm test
            codes+=("$?")
          done
          echo "CURRENT_FULL_EXIT_CODES=${codes[*]}"
          echo "CURRENT_FULL_SUITE=PASS_X4"

      - name: Final verification classification
        run: |
          echo "BASELINE_FULL_SUITE_REFERENCE=PASS_X4"
          echo "FEATURE_DIFFERENTIAL_REGRESSION=PASS"
          echo "INTEGRATION_VERIFICATION=PASS"
          echo "STAGING_PROMOTION_READY=YES"
          echo "PRODUCTION_CHANGED=NO"
