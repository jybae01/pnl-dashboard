name: Diagnose baseline analysis and Core timing flakes

on:
  push:
    branches:
      - agent/diagnose-core-viewer-baseline

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pre-feature integration baseline
        uses: actions/checkout@v4
        with:
          ref: 8bd98a02255e6da7c3c6d3a5ba6a04eed9fe76dd
          fetch-depth: 0
      - name: Verify baseline identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "8bd98a02255e6da7c3c6d3a5ba6a04eed9fe76dd"
          echo "BASELINE_IDENTITY=PASS"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Probe exact Analysis presentation test ten times
        working-directory: frontend
        shell: bash
        run: |
          set +e
          codes=()
          for i in $(seq 1 10); do
            echo "===== BASELINE ANALYSIS EXACT RUN $i ====="
            npm test -- AnalysisPresentationVerticalSlice.test.tsx -t "clears READY presentation and Evidence together when Viewer availability changes"
            codes+=("$?")
          done
          set -e
          echo "BASELINE_ANALYSIS_EXACT_EXIT_CODES=${codes[*]}"
      - name: Probe exact Core FX test ten times
        working-directory: frontend
        shell: bash
        run: |
          set +e
          codes=()
          for i in $(seq 1 10); do
            echo "===== BASELINE CORE FX EXACT RUN $i ====="
            npm test -- CoreVerticalSlice.test.tsx -t "preserves overlapping monthly FX values and sends exact YYYY-MM maps"
            codes+=("$?")
          done
          set -e
          echo "BASELINE_CORE_FX_EXACT_EXIT_CODES=${codes[*]}"
      - name: Repeat baseline full suite four times
        working-directory: frontend
        shell: bash
        run: |
          set +e
          codes=()
          for i in 1 2 3 4; do
            echo "===== BASELINE FULL RUN $i ====="
            npm test
            codes+=("$?")
          done
          set -e
          echo "BASELINE_FULL_EXIT_CODES=${codes[*]}"
      - name: Baseline diagnostic completed
        run: |
          echo "PRODUCT_CODE_CHANGED=NO"
          echo "DIAGNOSTIC_ONLY=YES"
