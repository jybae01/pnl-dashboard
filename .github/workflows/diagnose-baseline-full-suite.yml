name: Diagnose baseline full frontend suite

on:
  push:
    branches:
      - agent/fix-bidirectional-adjustment-input
    paths:
      - .github/workflows/diagnose-baseline-full-suite.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validated baseline
        uses: actions/checkout@v4
        with:
          ref: cb7810c6d8bf032249b3fb36614303f14f535725
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Capture baseline full frontend test output
        shell: bash
        working-directory: frontend
        run: |
          set +e
          npm test 2>&1 | tee ../baseline-full-suite.log
          code=${PIPESTATUS[0]}
          echo "$code" > ../baseline-full-suite-exit-code.txt
          exit 0

      - name: Upload baseline diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: baseline-full-suite-diagnostic
          path: |
            baseline-full-suite.log
            baseline-full-suite-exit-code.txt
          if-no-files-found: error
