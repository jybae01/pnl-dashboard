name: Verify bidirectional input on hardened baseline

on:
  push:
    branches:
      - agent/verify-bidirectional-after-blob-fix

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/verify-bidirectional-after-blob-fix
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Forecast vertical-slice regression
        working-directory: frontend
        run: npm test -- ForecastVerticalSlice.test.tsx
      - name: Run full frontend suite
        working-directory: frontend
        run: npm test
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
