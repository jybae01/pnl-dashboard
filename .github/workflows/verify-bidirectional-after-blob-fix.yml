name: Verify bidirectional input on hardened baseline

on:
  push:
    branches:
      - agent/verify-bidirectional-after-blob-fix

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/verify-bidirectional-after-blob-fix
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Repeat Forecast vertical-slice regression twice
        working-directory: frontend
        shell: bash
        run: |
          set +e
          codes=()
          for i in 1 2; do
            echo "===== FORECAST RUN $i ====="
            npm test -- ForecastVerticalSlice.test.tsx
            codes+=("$?")
          done
          set -e
          echo "FORECAST_EXIT_CODES=${codes[*]}"
          test "${codes[*]}" = "0 0"
      - name: Repeat full frontend suite twice
        working-directory: frontend
        shell: bash
        run: |
          set +e
          codes=()
          for i in 1 2; do
            echo "===== FULL RUN $i ====="
            npm test
            codes+=("$?")
          done
          set -e
          echo "FULL_EXIT_CODES=${codes[*]}"
          test "${codes[*]}" = "0 0"
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
