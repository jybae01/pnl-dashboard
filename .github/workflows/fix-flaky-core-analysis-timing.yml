name: Fix flaky Core and Analysis test timing

on:
  push:
    branches:
      - agent/fix-flaky-core-analysis-timing

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-flaky-core-analysis-timing
          fetch-depth: 0

      - name: Verify exact base and pre-patch scope
        shell: bash
        run: |
          git merge-base --is-ancestor 4081487a7a19917de19265b830aee27f5156312a HEAD
          actual="$(git diff --name-only 4081487a7a19917de19265b830aee27f5156312a..HEAD | sort)"
          expected='.github/workflows/fix-flaky-core-analysis-timing.yml'
          test "$actual" = "$expected"
          echo "BASE_408148_ANCESTOR=PASS"
          echo "PREPATCH_SCOPE=WORKFLOW_ONLY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Apply test-only timing fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          core = Path('frontend/src/integration/CoreVerticalSlice.test.tsx')
          text = core.read_text(encoding='utf-8')
          old_fx = "    expect(await screen.findByText('분석 조건 설정')).toBeInTheDocument();\n\n    const start = screen.getByLabelText('시작 월') as HTMLInputElement;\n"
          new_fx = "    expect(await screen.findByText('분석 조건 설정')).toBeInTheDocument();\n    await waitFor(() => expect(screen.getByLabelText('기준 모형 (Baseline)')).toHaveValue(BASE));\n\n    const start = screen.getByLabelText('시작 월') as HTMLInputElement;\n"
          if text.count(old_fx) != 1:
              raise SystemExit(f'Core FX anchor count={text.count(old_fx)}')
          text = text.replace(old_fx, new_fx)
          old_viewer = "    await waitFor(() => expect(screen.queryByTestId('stored-result')).not.toBeInTheDocument());\n    expect(screen.getByTestId('viewer-empty')).toBeInTheDocument();\n"
          new_viewer = "    expect(await screen.findByTestId('viewer-empty')).toBeInTheDocument();\n    expect(screen.queryByTestId('stored-result')).not.toBeInTheDocument();\n"
          if text.count(old_viewer) != 1:
              raise SystemExit(f'Core Viewer anchor count={text.count(old_viewer)}')
          core.write_text(text.replace(old_viewer, new_viewer), encoding='utf-8')
          analysis = Path('frontend/src/integration/AnalysisPresentationVerticalSlice.test.tsx')
          text = analysis.read_text(encoding='utf-8')
          old_analysis = "    await waitFor(() => expect(screen.queryByTestId('analysis-presentation')).not.toBeInTheDocument());\n    expect(screen.queryByRole('button', { name: '분석 근거 엑셀 내려받기' })).not.toBeInTheDocument();\n    expect(screen.getByTestId('viewer-empty')).toBeInTheDocument();\n"
          new_analysis = "    expect(await screen.findByTestId('viewer-empty')).toBeInTheDocument();\n    expect(screen.queryByTestId('analysis-presentation')).not.toBeInTheDocument();\n    expect(screen.queryByRole('button', { name: '분석 근거 엑셀 내려받기' })).not.toBeInTheDocument();\n"
          if text.count(old_analysis) != 1:
              raise SystemExit(f'Analysis Viewer anchor count={text.count(old_analysis)}')
          analysis.write_text(text.replace(old_analysis, new_analysis), encoding='utf-8')
          PY
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'frontend/src/integration/AnalysisPresentationVerticalSlice.test.tsx' 'frontend/src/integration/CoreVerticalSlice.test.tsx' | sort)"
          test "$actual" = "$expected"
          echo "TEST_ONLY_PATCH_SCOPE=PASS_TWO_FILES"

      - name: Stress Core FX timing case
        working-directory: frontend
        shell: bash
        run: |
          for i in $(seq 1 10); do
            npm test -- CoreVerticalSlice.test.tsx -t "preserves overlapping monthly FX values and sends exact YYYY-MM maps"
          done
          echo "CORE_FX_STRESS=PASS_X10"

      - name: Stress Viewer transition timing cases
        working-directory: frontend
        shell: bash
        run: |
          for i in $(seq 1 10); do
            npm test -- CoreVerticalSlice.test.tsx -t "clears cached Viewer result after the backend later denies availability"
            npm test -- AnalysisPresentationVerticalSlice.test.tsx -t "clears READY presentation and Evidence together when Viewer availability changes"
          done
          echo "VIEWER_TRANSITION_STRESS=PASS_X10_EACH"

      - name: Repeat full frontend suite four times
        working-directory: frontend
        shell: bash
        run: |
          for i in 1 2 3 4; do
            echo "===== FULL SUITE RUN $i ====="
            npm test
          done
          echo "FULL_SUITE=PASS_X4"

      - name: Lint
        working-directory: frontend
        shell: bash
        run: |
          npm run lint
          echo "LINT=PASS"

      - name: Build
        working-directory: frontend
        shell: bash
        run: |
          npm run build
          echo "BUILD=PASS"

      - name: Commit verified test-only cleanup
        shell: bash
        run: |
          git rm .github/workflows/fix-flaky-core-analysis-timing.yml
          actual="$(git diff --name-only 4081487a7a19917de19265b830aee27f5156312a | sort)"
          expected="$(printf '%s\n' 'frontend/src/integration/AnalysisPresentationVerticalSlice.test.tsx' 'frontend/src/integration/CoreVerticalSlice.test.tsx' | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/integration/CoreVerticalSlice.test.tsx frontend/src/integration/AnalysisPresentationVerticalSlice.test.tsx
          git commit -m 'test: stabilize async analysis timing assertions'
          git push origin HEAD:agent/fix-flaky-core-analysis-timing
          echo "VERIFIED_TEST_CLEANUP_PUSHED=YES"
          echo "PRODUCT_CODE_CHANGED=NO"
          echo "PRODUCTION_CHANGED=NO"
