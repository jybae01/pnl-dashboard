name: Verify bidirectional adjustment input

on:
  push:
    branches:
      - agent/fix-bidirectional-adjustment-input
    paths:
      - frontend/**
      - .github/workflows/apply-bidirectional-adjustment-fix.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/fix-bidirectional-adjustment-input
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run focused bidirectional contract test
        working-directory: frontend
        run: npm test -- ForecastBidirectionalAdjustment.test.tsx

      - name: Run full frontend tests
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
